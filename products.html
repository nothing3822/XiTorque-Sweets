<link rel="stylesheet" href="styles.css">
<style>
.products-showcase{max-width:860px;margin:0 auto;}
.product-showcase-item{
  display:block;text-decoration:none;color:inherit;
  position:relative;overflow:hidden;border-radius:var(--radius-lg);
  box-shadow:var(--shadow-soft);cursor:pointer;
  transition:transform 0.2s ease, box-shadow 0.2s ease;
}
.product-showcase-item:hover{transform:translateY(-4px);box-shadow:0 20px 50px rgba(30,58,95,0.18);}
.product-showcase-item img{
  width:100%;display:block;
  aspect-ratio:1/1;object-fit:cover;
}
.product-showcase-label{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(to top, rgba(15,7,9,0.88) 0%, rgba(15,7,9,0.0) 100%);
  padding:40px 28px 22px;
  text-align:center;
}
.product-showcase-label h2{
  color:#fff;font-size:clamp(1.5rem,4vw,2.2rem);
  margin:0 0 4px;text-shadow:0 2px 8px rgba(0,0,0,0.7);
}
.product-showcase-label p{
  color:var(--gold-soft);font-size:0.95rem;font-weight:600;
  margin:0;text-shadow:0 1px 4px rgba(0,0,0,0.7);
}
.product-showcase-label .click-hint{
  display:inline-flex;align-items:center;gap:8px;
  margin-top:12px;background:rgba(193,144,15,0.25);
  border:1px solid var(--gold-soft);color:var(--gold-soft);
  padding:7px 18px;border-radius:999px;font-size:0.82rem;font-weight:700;
}
</style>
