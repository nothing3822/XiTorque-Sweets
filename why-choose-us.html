<!DOCTYPE html>

<head>

<title>Why Choose Us — Xitorque Sweets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.why-card{
  position:relative;
  width:100%;
  min-height:100vh;
  display:flex;
  align-items:flex-end;
  overflow:hidden;
}
.why-card img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  z-index:0;
}
.why-card .overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(10,5,5,0.92) 0%,
    rgba(10,5,5,0.55) 40%,
    rgba(10,5,5,0.10) 100%
  );
  z-index:1;
}
.why-card .content{
  position:relative;
  z-index:2;
  width:100%;
  padding:60px 48px;
  max-width:860px;
  margin:0 auto;
}
@media(max-width:600px){
  .why-card .content{padding:40px 22px;}
  .why-card{min-height:85vh;}
}
.why-card .tag{
  display:inline-block;
  background:var(--gold);
  color:#1a0a00;
  font-size:0.78rem;
  font-weight:800;
  letter-spacing:0.12em;
  text-transform:uppercase;
  padding:6px 18px;
  border-radius:999px;
  margin-bottom:20px;
}
body.lang-ur .why-card .tag{
  text-transform:none;letter-spacing:0;
}
.why-card h2{
  color:#fff;
  font-size:clamp(1.8rem,4vw,2.8rem);
  margin:0 0 18px;
  text-shadow:0 2px 12px rgba(0,0,0,0.7);
  line-height:1.2;
}
.why-card p{
  color:rgba(255,255,255,0.88);
  font-size:clamp(0.98rem,1.8vw,1.12rem);
  line-height:1.8;
  max-width:620px;
  margin:0;
  text-shadow:0 1px 6px rgba(0,0,0,0.6);
}
</style>
</head>

<!-- 1 — Cleanliness -->
<div class="why-card reveal">

    <p data-en="Every counter, surface and glass display is cleaned and checked daily. Workers wear gloves, caps and masks at all times — no exceptions." data-ur="ہر کاؤنٹر، سطح اور شیشے کا ڈسپلے روزانہ صاف اور چیک کیا جاتا ہے۔ ورکرز ہر وقت دستانے، کیپ اور ماسک پہنتے ہیں — کوئی استثناء نہیں۔"></p>
