<style>
.why-item{
  display:grid;
  grid-template-columns:1fr;
  gap:0;
  margin-bottom:0;
}
@media(min-width:760px){
  .why-item{grid-template-columns:1fr 1fr;}
  .why-item.reverse .why-img-wrap{order:2;}
  .why-item.reverse .why-text-wrap{order:1;}
}
.why-img-wrap{
  overflow:hidden;
  max-height:480px;
}
.why-img-wrap img{
  width:100%;height:100%;
  object-fit:cover;display:block;
  transition:transform 0.5s ease;
}
.why-img-wrap:hover img{transform:scale(1.03);}
.why-text-wrap{
  display:flex;flex-direction:column;justify-content:center;
  padding:48px 40px;background:var(--card);
}
@media(max-width:760px){.why-text-wrap{padding:32px 24px;}}
.why-text-wrap .num{
  font-size:3.5rem;font-weight:700;line-height:1;
  color:var(--gold-soft);opacity:0.35;
  font-family:'Fraunces',serif;margin-bottom:10px;
}
.why-text-wrap h3{
  font-size:clamp(1.4rem,3vw,2rem);margin-bottom:14px;
}
.why-text-wrap p{font-size:1rem;line-height:1.75;}
.section-divider{
  height:2px;
  background:linear-gradient(to right, transparent, var(--gold-soft), transparent);
  margin:0;
}

<!-- 1. Cleanliness -->
<div class="why-item reveal">

  <div class="why-text-wrap">

  </div>
</div>

<div class="section-divider"></div>
