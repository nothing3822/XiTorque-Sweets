.product-hero-img{

.product-hero-wrap{position:relative;}
.product-hero-wrap .overlay{

}
.product-hero-wrap .hero-title{
  position:absolute;bottom:32px;left:0;right:0;text-align:center;
}
.product-hero-wrap .hero-title h1{
  color:#fff;font-size:clamp(2rem,5vw,3.2rem);margin:0 0 6px;
  text-shadow:0 3px 12px rgba(0,0,0,0.8);
}
.product-hero-wrap .hero-title p{

  margin:0;text-shadow:0 2px 6px rgba(0,0,0,0.7);
}
.ingredient-card{
  text-align:center;padding:0;overflow:hidden;
}
.ingredient-card img{
  width:100%;aspect-ratio:1/1;object-fit:cover;
  transition:transform 0.3s ease;
}
.ingredient-card:hover img{transform:scale(1.04);}
.ingredient-card .ing-label{
  padding:14px 12px 18px;background:var(--card);
}
.ingredient-card .ing-label h4{
  font-size:1rem;margin:0 0 4px;color:var(--indigo-deep);
}
.ingredient-card .ing-label p{
  font-size:0.83rem;margin:0;color:var(--ink-soft);
}
.ingredients-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
